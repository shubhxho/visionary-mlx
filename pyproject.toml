[project]
name = "visionary-mlx"
version = "0.2.0"
description = "Dreamer-style world models on Apple Silicon. Video tokenizer, flow dynamics, and agents that train inside their own dreams — all in MLX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubh Gupta" }]
keywords = ["mlx", "world-models", "dreamer", "apple-silicon", "rl"]
dependencies = [
    "mlx>=0.26.0",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
visionary-mlx = "visionary_mlx.cli:main"

[project.urls]
Homepage = "https://github.com/shubhxho/visionary-mlx"
Repository = "https://github.com/shubhxho/visionary-mlx"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionary_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
